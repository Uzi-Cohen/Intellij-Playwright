pluginGroup = dev.uzi.pw
pluginName = Playwright for IntelliJ
pluginRepositoryUrl = https://github.com/uzi-cohen/Intellij-Playwright
pluginVersion = 0.1.0

# Compile against the oldest supported platform (since-build 261).
platformVersion = 2026.1.5

# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

org.gradle.configuration-cache = true
org.gradle.caching = true
