<body class="locators-view">
  <div class="section">
    <div class="hbox">
      <div class="actions" id="actions"></div>
      <label id="locatorLabel">Locator</label>
      <div class="hbox" id="locatorSpacer"></div>
      <div class="actions" id="locatorExtra"></div>
      <label id="copyToClipboardLabel" title="Automatically copy picked locator to clipboard">
        <input id="copyToClipboardCheckbox" type="checkbox">
        Copy on pick
      </label>
    </div>
    <input id="locator" placeholder="Locator" aria-labelledby="locatorLabel">
    <p id="locatorError" class="error"></p>
  </div>
  <div id="ariaSection" class="section">
    <div class="hbox">
      <div class="actions" id="actions-2"></div>
      <label id="ariaLabel">Aria</label>
      <div class="hbox"></div>
      <div class="actions" id="ariaExtra"></div>
    </div>
    <textarea id="ariaSnapshot" placeholder="Aria" rows="10" aria-labelledby="ariaLabel"></textarea>
    <p id="ariaSnapshotError" class="error"></p>
  </div>
</body>
